# Checks that plum.elixpo and branding carry the same shared workflows
# as this repository (tools/sync-workflows.sh). Fix drift with:
#   sh tools/sync-workflows.sh ../plum.elixpo ../branding
name: Workflow sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - tools/sync-workflows.sh
  schedule:
    - cron: "41 6 * * 1" # weekly, Monday
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: plumlang/plum.elixpo
          path: siblings/plum.elixpo
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: plumlang/branding
          path: siblings/branding
          persist-credentials: false
      - run: sh tools/sync-workflows.sh --check siblings/plum.elixpo siblings/branding
