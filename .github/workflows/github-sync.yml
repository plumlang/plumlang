# Checks that plum.elixpo, branding, registry, tree-sitter-plum, setup-plum and zed-plum carry the same shared .github files
# as this repository (tools/sync-github.sh). Fix drift with:
#   sh tools/sync-github.sh ../plum.elixpo ../branding ../registry ../tree-sitter-plum ../setup-plum ../zed-plum
name: GitHub sync

on:
  push:
    branches: [main]
    paths:
      - .github/**
      - tools/sync-github.sh
  schedule:
    - cron: "41 6 * * 1" # weekly, Monday
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: plumlang/plum.elixpo
          path: siblings/plum.elixpo
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: plumlang/branding
          path: siblings/branding
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: plumlang/registry
          path: siblings/registry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: plumlang/tree-sitter-plum
          path: siblings/tree-sitter-plum
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: plumlang/setup-plum
          path: siblings/setup-plum
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: plumlang/zed-plum
          path: siblings/zed-plum
          persist-credentials: false
      - run: sh tools/sync-github.sh --check siblings/plum.elixpo siblings/branding siblings/registry \
          siblings/tree-sitter-plum siblings/setup-plum siblings/zed-plum
