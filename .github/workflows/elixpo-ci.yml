# Elixpo CI — the drop-in workflow shared by Elixpo projects.
# Configure the project in .elixpo/project.yml
#
# What this does:
#   push/PR to main   → quality gate (lint, test, build from .elixpo/project.yml)
#   PR opened          → auto-label, auto-assign, link the issue from the branch name
#   weekly cron        → stale issue/PR cleanup (roadmap issues are exempt)

name: Elixpo CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Weekly Monday 9 AM UTC — stale cleanup

jobs:
  quality:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    uses: ./.github/workflows/quality-gate.yml
    secrets: inherit
    permissions:
      contents: read

  pr-manage:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    uses: ./.github/workflows/pr-management.yml
    secrets: inherit
    # The repository's default token is read-only; a reusable workflow may
    # not ask for more than its caller grants, or the run fails to start.
    permissions:
      contents: read
      issues: write
      pull-requests: write

  stale:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/stale-management.yml
    secrets: inherit
    permissions:
      issues: write
      pull-requests: write
