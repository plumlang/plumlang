#
# Build and test Plumlang on every OS and compiler it supports
# (PREAMBLE 2.2), under the sanitizers (PREAMBLE 2.4), and check formatting.
name: Build

on:
  push:
    branches: [main]
  # Every pull request, including ones stacked on another PR's branch.
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: ubuntu-24.04-arm, cc: gcc }
          - { os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make CC=${{ matrix.cc }}
      - run: make CC=${{ matrix.cc }} test
      - run: ./plum version

  sanitize:
    name: sanitizers / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make CC=${{ matrix.cc }} sanitize test

  # The value layout that isn't the default (src/vm/value.h, #121), so it
  # keeps building and passing: NaN-boxed 8-byte values.
  nanbox:
    name: nanbox / ${{ matrix.os }} / ${{ matrix.cc }} ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc, mode: sanitize }
          - { os: ubuntu-latest, cc: clang, mode: sanitize }
          - { os: ubuntu-24.04-arm, cc: gcc, mode: release }
          - { os: macos-latest, cc: clang, mode: release }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make CC=${{ matrix.cc }} NANBOX=1 ${{ matrix.mode }} test

  windows-msvc:
    name: windows / msvc
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cmake -S . -B build
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: build\Release\plum.exe version
        shell: cmd

  windows-mingw:
    name: windows / mingw-w64
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: make git mingw-w64-ucrt-x86_64-gcc
      - run: make CC=gcc
      - run: make CC=gcc test
      - run: ./plum version

  # The browser build (make wasm, docs/playground.md), with Emscripten
  # from the image the Makefile pins, checked against native plum.
  wasm:
    name: wasm / emscripten
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make -j"$(nproc)"
      # The value layout that isn't the default (#121), on a 32-bit target
      # too; first, since both write build/wasm
      - run: make wasm NANBOX=1 WASM_JOBS="$(nproc)" && sh tests/wasm.sh ./plum
      - run: make wasm WASM_JOBS="$(nproc)"
      - run: test -f build/wasm/plum.wasm && sh tests/wasm.sh ./plum
      - name: Size
        run: |
          raw=$(wc -c < build/wasm/plum.wasm)
          gz=$(gzip -9c build/wasm/plum.wasm | wc -c)
          echo "plum.wasm: $raw bytes, $gz gzipped" | tee -a "$GITHUB_STEP_SUMMARY"

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Pinned so every contributor formats the same way: pip install clang-format==18.1.8
      - run: pipx install clang-format==18.1.8
      - run: make format-check
