# SPDX-License-Identifier: Apache-2.0 OR LicenseRef-Plumlang-Commercial-1.0
#
# Benchmarks (bench/README.md, issue #116): build the release binary, run
# bench/run.py against Python, Lua and Node.js, upload the results as the
# `bench-results` artifact, and compare Plumlang's times with the last
# successful run on main. On a pull request, a benchmark more than
# BENCH_THRESHOLD percent slower than main fails the job; on main the
# comparison is only reported, so every main run becomes the next baseline.
#
# To change the threshold, set the repository variable BENCH_THRESHOLD
# (Settings > Secrets and variables > Actions > Variables), e.g. 10;
# without it, the default below applies.
name: Bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to find and download main's last results

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCH_THRESHOLD: ${{ vars.BENCH_THRESHOLD || '15' }}
  BENCH_RUNS: "5"

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Lua
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - name: Build (release)
        run: make -j"$(nproc)"
      - name: Run the benchmarks
        run: |
          mkdir -p bench-results
          python3 bench/run.py ./plum --runs "$BENCH_RUNS" --json bench-results/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-results
          path: bench-results/results.json
          retention-days: 90
      - name: Fetch main's last results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh run list -R "$REPO" --workflow bench.yml --branch main --event push \
                 --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$id" ]; then
            echo "No successful run on main yet: nothing to compare with."
            exit 0
          fi
          echo "Baseline: run $id"
          gh run download "$id" -R "$REPO" -n bench-results -D baseline \
            || echo "Couldn't download run $id's results (expired?): nothing to compare with."
      - name: Compare with main
        run: |
          python3 bench/compare.py bench-results/results.json baseline/results.json \
            --threshold "$BENCH_THRESHOLD" --summary "$GITHUB_STEP_SUMMARY" \
            ${{ github.event_name == 'pull_request' && ' ' || '--warn-only' }}
