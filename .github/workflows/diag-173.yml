# Temporary: diagnostics for #173 (removed before merging).
name: diag-173
on:
  push:
    branches: [build/issue-173]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diag:
    name: ${{ matrix.os }} / ${{ matrix.step }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, step: bench }
          - { os: macos-latest, step: upstream }
          - { os: ubuntu-latest, step: upstream }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: clang --version
      - run: bash .github/diag173/${{ matrix.step }}.sh
