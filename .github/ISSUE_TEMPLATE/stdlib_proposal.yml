name: Library proposal
description: A new standard library module, or new functions in an existing one.
title: "stdlib: "
labels: ["area-stdlib", "enhancement"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - io
        - math
        - string
        - fs
        - os
        - time
        - json
        - net
        - net.http
        - A new module
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: Signatures and a short example of use.
      render: plum
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it belongs in the standard library
      description: What programs need it, and why a third-party module is not enough.
    validations:
      required: true

  - type: textarea
    id: portability
    attributes:
      label: Portability
      description: How it works on Linux, macOS and Windows, and anything it needs from the OS.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the project's [Code of Conduct](https://github.com/plumlang/plumlang/blob/main/CODE_OF_CONDUCT.md).
          required: true
